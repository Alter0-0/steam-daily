<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steam 今日情报</title>
  <style>
    :root {
      --bg: #f2f4f6;
      --panel: #ffffff;
      --ink: #14212b;
      --muted: #66737e;
      --line: #dfe5e9;
      --navy: #17324a;
      --navy-2: #254e6e;
      --orange: #e77e45;
      --orange-soft: #fff0e8;
      --mint: #2c8f78;
      --mint-soft: #e8f6f1;
      --blue-soft: #e9f1f7;
      --shadow: 0 14px 38px rgba(28, 48, 64, .08);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; }
    .topbar { background: var(--navy); color: #fff; }
    .topbar-inner { max-width: 1440px; margin: 0 auto; padding: 24px 34px 22px; display: flex; justify-content: space-between; gap: 28px; align-items: flex-start; }
    .brand-kicker { color: #a7c2d3; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 5px 0 7px; font-size: clamp(27px, 3vw, 40px); line-height: 1.08; letter-spacing: 0; }
    .subtitle { color: #c2d0d9; margin: 0; font-size: 14px; }
    .topbar-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .status-chip { padding: 9px 12px; border-radius: 5px; border: 1px solid rgba(255,255,255,.18); color: #d8e5ec; font-size: 12px; white-space: nowrap; }
    .status-chip strong { color: #fff; font-weight: 650; }
    .status-chip.demo { border-color: rgba(255,180,130,.45); color: #ffd0b5; }
    main { max-width: 1440px; margin: 0 auto; padding: 22px 34px 52px; }
    .date-rail { display: grid; grid-template-columns: repeat(6, minmax(112px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .date-card { appearance: none; border: 1px solid var(--line); background: #fff; text-align: left; padding: 13px 14px; min-height: 80px; border-radius: 7px; color: var(--ink); transition: border-color .18s, transform .18s, box-shadow .18s; }
    .date-card:hover { transform: translateY(-2px); border-color: #a7b9c7; box-shadow: 0 7px 18px rgba(26, 53, 70, .08); }
    .date-card.active { border: 2px solid var(--orange); padding: 12px 13px; box-shadow: 0 8px 20px rgba(231, 126, 69, .14); }
    .date-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 7px; }
    .date-card.active .date-label { color: var(--orange); font-weight: 700; }
    .date-number { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .date-number strong { font-size: 18px; letter-spacing: .02em; }
    .date-count { color: var(--muted); font-size: 12px; }
    .toolbar { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 13px 14px; display: flex; gap: 11px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; box-shadow: 0 5px 15px rgba(30, 52, 64, .04); }
    .search-wrap { position: relative; flex: 1 1 230px; }
    .search-wrap input { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px 10px 37px; color: var(--ink); outline: none; }
    .search-wrap input:focus { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(37,78,110,.12); }
    .search-mark { position: absolute; left: 13px; top: 8px; color: #7e8b95; font-size: 19px; line-height: 1; }
    select, .toggle { border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); min-height: 40px; padding: 9px 12px; }
    select { min-width: 165px; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; user-select: none; }
    .toggle input { accent-color: var(--orange); width: 16px; height: 16px; }
    .result-meta { color: var(--muted); font-size: 13px; margin-left: auto; }
    .archive-search-bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 18px; }
    .archive-search-bar p { margin: 0; color: var(--muted); font-size: 13px; }
    .archive-search-button { border: 1px solid var(--navy-2); border-radius: 6px; padding: 11px 17px; background: var(--navy); color: #fff; white-space: nowrap; }
    .global-search-dialog { width: min(780px, calc(100% - 32px)); max-height: calc(100dvh - 40px); padding: 0; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--bg); box-shadow: var(--shadow); }
    .global-search-dialog::backdrop { background: rgba(14, 29, 41, .56); }
    body:has(.global-search-dialog[open]) { overflow: hidden; }
    .global-search-header { position: sticky; top: 0; background: #fff; padding: 20px; border-bottom: 1px solid var(--line); z-index: 1; }
    .global-search-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .global-search-heading h2 { margin: 0; font-size: 21px; }
    .global-search-close, .global-search-more { border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 8px 12px; color: var(--ink); }
    .global-search-header p, .global-search-summary { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .global-search-header .search-wrap { display: block; margin-top: 12px; }
    .global-search-summary { margin: 0; padding: 16px 20px 0; }
    .global-search-results { display: grid; gap: 10px; padding: 14px 20px 20px; }
    .global-search-result { padding: 15px; background: #fff; border: 1px solid var(--line); border-radius: 7px; min-width: 0; overflow-wrap: anywhere; }
    .global-search-result h3 { margin: 0; font-size: 17px; }
    .global-search-alias { color: var(--muted); font-size: 12px; margin: 5px 0 10px; }
    .global-search-records { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
    .global-search-record { padding: 8px 10px; border-radius: 5px; border: 1px solid #cbdbe7; color: var(--navy-2); background: var(--blue-soft); font-size: 12px; text-align: left; }
    .global-search-result details { color: var(--muted); font-size: 12px; }
    .global-search-result .store-link { display: inline-block; margin-top: 4px; }
    .navigation-notice { padding: 12px 15px; margin-bottom: 18px; border-radius: 6px; background: var(--blue-soft); color: var(--navy-2); font-size: 13px; }
    .game-card.search-target { outline: 3px solid var(--orange); outline-offset: 3px; }
    .sections { display: grid; gap: 26px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
    .section-title { display: flex; gap: 10px; align-items: center; }
    .section-title h2 { margin: 0; font-size: 19px; letter-spacing: 0; }
    .section-count { color: var(--muted); font-size: 13px; }
    .section-rule { height: 1px; background: var(--line); flex: 1; margin-left: 13px; }
    .section-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }
    .section-dot.blue { background: #5582a2; }
    .section-dot.mint { background: var(--mint); }
    .game-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .game-card { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; display: grid; grid-template-columns: 120px minmax(0, 1fr); min-height: 164px; transition: transform .18s, box-shadow .18s, border-color .18s; }
    .game-card.cover-missing { grid-template-columns: minmax(0, 1fr); }
    .game-card:hover { transform: translateY(-2px); border-color: #b3c0c8; box-shadow: var(--shadow); }
    .cover { width: 120px; height: 100%; min-height: 164px; object-fit: cover; background: #dbe5ea; }
    .card-body { padding: 14px 14px 12px; min-width: 0; display: flex; flex-direction: column; }
    .card-topline { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .game-name { margin: 0; font-size: 16px; line-height: 1.28; font-weight: 720; }
    .game-name-en { color: var(--muted); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rating { color: var(--mint); font-weight: 750; white-space: nowrap; font-size: 14px; }
    .rating.low { color: #c17b3d; }
    .rating small { display: block; color: var(--muted); font-size: 10px; font-weight: 500; text-align: right; margin-top: 2px; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .tag { display: inline-block; background: var(--blue-soft); color: #3a617c; padding: 4px 7px; border-radius: 4px; font-size: 11px; }
    .tag.status { background: var(--orange-soft); color: #a95529; }
    .tag.demo { background: var(--mint-soft); color: #247561; }
    .card-info { margin-top: auto; display: grid; gap: 4px; color: var(--muted); font-size: 11px; }
    .info-line { display: flex; gap: 6px; min-width: 0; }
    .info-label { color: #8b969e; flex: 0 0 auto; }
    .info-value { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-line.release-time .info-value { white-space: normal; overflow-wrap: anywhere; }
    .card-footer { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .price { font-size: 14px; font-weight: 760; color: var(--ink); }
    .price.free { color: var(--mint); }
    .price-note { color: var(--muted); font-size: 11px; order: 3; flex-basis: 100%; line-height: 1.5; }
    .store-link { margin-left: auto; text-decoration: none; color: #2d6388; font-size: 12px; font-weight: 650; }
    .store-link:hover { text-decoration: underline; }
    .empty { background: var(--panel); border: 1px dashed #cbd5da; border-radius: 7px; padding: 30px 20px; text-align: center; color: var(--muted); font-size: 14px; }
    .footnote { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 17px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .footnote strong { color: var(--ink); }
    @media (max-width: 1120px) { .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 760px) {
      .topbar-inner, main { padding-left: 17px; padding-right: 17px; }
      .topbar-inner { display: block; }
      .topbar-meta { justify-content: flex-start; margin-top: 18px; }
      .date-rail { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .game-grid { grid-template-columns: 1fr; }
      .game-card { grid-template-columns: 128px 1fr; }
      .cover { width: 128px; }
      .result-meta { width: 100%; margin-left: 0; }
      .archive-search-bar { align-items: flex-start; }
      .global-search-header { padding: 16px; }
      .global-search-results { padding: 14px 16px 16px; }
    }
    @media (max-width: 430px) {
      .date-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .game-card { grid-template-columns: 110px 1fr; }
      .cover { width: 110px; height: 154px; }
      .game-card { min-height: 154px; }
      .card-body { padding: 11px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <div class="brand-kicker">Steam / Daily Brief</div>
          <h1>Steam 今日情报</h1>
          <p class="subtitle">把一天里值得看的新游戏，整理成一页安静的日报。</p>
        </div>
        <div class="topbar-meta">
          <div class="status-chip"><strong>中国大陆时间</strong> · 每日 04:00</div>
          <div class="status-chip demo" id="dataStatus"><strong>演示数据</strong> · 等待本地采集器</div>
        </div>
      </div>
    </header>
    <main>
      <div class="archive-search-bar">
        <p>按日期阅读日报，或直接查找已收录的游戏。</p>
        <button class="archive-search-button" id="openGlobalSearch" type="button">搜索全部日报</button>
      </div>
      <nav class="date-rail" id="dateRail" aria-label="历史日报"></nav>
      <section class="toolbar" aria-label="筛选工具">
        <label class="search-wrap">
          <span class="search-mark" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索当前日报" aria-label="搜索当前日报" autocomplete="off" />
        </label>
        <select id="tagSelect" aria-label="按标签筛选"><option value="all">全部标签</option></select>
        <select id="sortSelect" aria-label="排序方式">
          <option value="rating">按好评率排序</option>
          <option value="reviews">按评论量排序（最多优先）</option>
          <option value="time">按发售时间排序</option>
          <option value="price">按价格排序</option>
        </select>
        <label class="toggle"><input id="demoOnly" type="checkbox" /> 只看 Demo</label>
        <span class="result-meta" id="resultMeta"></span>
      </section>
      <div class="navigation-notice" id="navigationNotice" role="status" hidden></div>
      <div class="sections" id="sections"></div>
      <div class="footnote">
        <span><strong>数据说明</strong>　日报按中国大陆时间统计；新商品页从首次运行后建立基线。</span>
        <span id="syncStatus">当前显示内置演示日报 · <strong>V1</strong></span>
      </div>
    </main>
    <dialog class="global-search-dialog" id="globalSearchDialog" aria-labelledby="globalSearchTitle" aria-describedby="globalSearchScope">
      <div class="global-search-header">
        <div class="global-search-heading">
          <h2 id="globalSearchTitle">搜索全部日报</h2>
          <form method="dialog"><button class="global-search-close" aria-label="关闭全局搜索">关闭</button></form>
        </div>
        <p id="globalSearchScope">搜索本站已收录的全部日报，不受当前日期、标签和 Demo 筛选影响。</p>
        <label class="search-wrap">
          <span class="search-mark" aria-hidden="true">⌕</span>
          <input id="globalSearchInput" type="search" placeholder="输入中文名、英文名或 AppID" aria-label="搜索全部日报的游戏" autocomplete="off" autofocus />
        </label>
      </div>
      <p class="global-search-summary" id="globalSearchSummary" role="status" aria-live="polite"></p>
      <div class="global-search-results" id="globalSearchResults"></div>
    </dialog>
  </div>
  <script>
    const cover = id => `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${id}/header.jpg`;
    let reports = [
      {

    const state = { reportIndex: 0, query: '', tag: 'all', sort: 'rating', demoOnly: false };
    const allGames = report => report.sections.flatMap(section => section.games);
    let tags = [];
    const tagSelect = document.querySelector('#tagSelect');
    function refreshTags() {
      const previous = state.tag;
      tags = [...new Set(reports.flatMap(report => allGames(report).flatMap(game => game.tags || [])))].sort((a,b) => a.localeCompare(b, 'zh'));
      tagSelect.innerHTML = '<option value="all">全部标签</option>';
      tags.forEach(tag => { const option = document.createElement('option'); option.value = tag; option.textContent = tag; tagSelect.appendChild(option); });
      state.tag = tags.includes(previous) ? previous : 'all'; tagSelect.value = state.tag;
    }
    const dateRail = document.querySelector('#dateRail');
    const sections = document.querySelector('#sections');
    const resultMeta = document.querySelector('#resultMeta');
    const searchInput = document.querySelector('#searchInput');
    const sortSelect = document.querySelector('#sortSelect');
    const demoOnly = document.querySelector('#demoOnly');
    const navigationNotice = document.querySelector('#navigationNotice');
    const globalSearchDialog = document.querySelector('#globalSearchDialog');
    const globalSearchInput = document.querySelector('#globalSearchInput');
    const globalSearchResults = document.querySelector('#globalSearchResults');
    const globalSearchSummary = document.querySelector('#globalSearchSummary');
    const globalSearch = { index: [], query: '', matches: [], limit: 30 };

    // Global search core: independent of the currently selected day and filters.
    function normalizeSearch(value) {
      return String(value ?? '').normalize('NFKC').toLocaleLowerCase().replace(/\s+/g, ' ').trim();
    }
    function buildGlobalSearchIndex(savedReports) {
      const entries = new Map();
      for (const report of [...savedReports].sort((a,b) => b.date.localeCompare(a.date))) {
        for (const section of report.sections || []) for (const game of section.games || []) {
          const id = String(game.id);
          if (!/^\d+$/.test(id)) continue;
          let entry = entries.get(id);
          if (!entry) {
            entry = { id, game, aliases: new Set(), occurrences: [], latestDate: report.date };
            entries.set(id, entry);
          }
          if (entry.game.provisional && !game.provisional) entry.game = game;
          for (const name of [game.name, game.en]) if (name) entry.aliases.add(String(name));
          if (!entry.occurrences.some(hit => hit.date === report.date && hit.sectionKey === section.key)) {
            entry.occurrences.push({ date: report.date, sectionKey: section.key, title: section.title || section.key });
          }
        }
      }
      return [...entries.values()].map(entry => ({ ...entry, aliases: [...entry.aliases], names: [...entry.aliases].map(normalizeSearch) }));
    }
    function searchAllReports(index, query) {
      const normalized = normalizeSearch(query);
      if (!normalized) return [];
      const words = normalized.split(' ');
      return index.filter(entry => entry.id === normalized || words.every(word => entry.names.some(name => name.includes(word))))
        .map(entry => ({ entry, rank: entry.id === normalized || entry.names.includes(normalized) ? 0 : entry.names.some(name => name.startsWith(normalized)) ? 1 : 2 }))
        .sort((a,b) => a.rank - b.rank || b.entry.latestDate.localeCompare(a.entry.latestDate) || a.entry.game.name.localeCompare(b.entry.game.name, 'zh') || a.entry.id.localeCompare(b.entry.id))
        .map(match => match.entry);
    }
    // End global search core.
    const escapeSearchText = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function refreshGlobalSearch() {
      globalSearch.index = buildGlobalSearchIndex(reports);
      const dates = reports.map(report => report.date).sort();
      document.querySelector('#globalSearchScope').textContent = dates.length
        ? `搜索 ${dates[0]} 至 ${dates.at(-1)} 的全部已收录日报，不受当前日期、标签和 Demo 筛选影响。`
        : '暂无已收录日报，数据载入后可搜索。不受当前日报筛选影响。';
      globalSearch.matches = searchAllReports(globalSearch.index, globalSearch.query);
      renderGlobalSearch();
    }
    function renderGlobalSearch() {
      if (!normalizeSearch(globalSearch.query)) {
        globalSearchSummary.textContent = `已收录 ${globalSearch.index.length} 款游戏。输入名称或 AppID 开始查找。`;
        globalSearchResults.innerHTML = '<div class="empty">这里只搜索本站已有日报。资料待补齐的游戏可能暂时只有英文名。</div>';
        return;
      }
      const matches = globalSearch.matches;
      globalSearchSummary.textContent = matches.length ? `找到 ${matches.length} 款游戏，同一游戏的日报记录已合并。点击日期可查看对应记录。` : '没有找到匹配的游戏。';
      if (!matches.length) {
        globalSearchResults.innerHTML = '<div class="empty">可尝试部分名称、英文名或 AppID。本站尚未收录或仍待补齐中文名的游戏，可能暂时搜不到。</div>';
        return;
      }
      globalSearchResults.innerHTML = matches.slice(0, globalSearch.limit).map((entry, index) => {
        const occurrenceButton = (hit, hitIndex) => `<button class="global-search-record" type="button" data-search-result="${index}" data-search-hit="${hitIndex}">${escapeSearchText(hit.date)} · ${escapeSearchText(hit.title)}</button>`;
        const recent = entry.occurrences.slice(0,3).map(occurrenceButton).join('');
        const older = entry.occurrences.slice(3).map((hit, index) => occurrenceButton(hit, index + 3)).join('');
        return `<article class="global-search-result"><h3>${escapeSearchText(entry.game.name)}</h3><p class="global-search-alias">${entry.aliases.filter(name => name !== entry.game.name).map(escapeSearchText).join(' · ')}${entry.game.provisional ? ' · 详情待补齐' : ''}</p><div class="global-search-records">${recent}</div>${older ? `<details><summary>另有 ${entry.occurrences.length - 3} 条日报记录</summary><div class="global-search-records">${older}</div></details>` : ''}<a class="store-link" href="https://store.steampowered.com/app/${entry.id}/" target="_blank" rel="noreferrer">打开 Steam 商店 ↗</a></article>`;
      }).join('') + (matches.length > globalSearch.limit ? `<button class="global-search-more" id="showMoreSearchResults" type="button">继续显示（已显示 ${globalSearch.limit} / ${matches.length} 款）</button>` : '');
    }
    document.querySelector('#openGlobalSearch').addEventListener('click', () => {
      globalSearchDialog.showModal();
      globalSearchInput.focus();
    });
    globalSearchDialog.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !event.isComposing) {
        event.preventDefault(); globalSearchDialog.close();
      }
    });
    globalSearchInput.addEventListener('input', event => {
      if (event.isComposing) return;
      globalSearch.query = event.target.value;
      globalSearch.limit = 30;
      globalSearch.matches = searchAllReports(globalSearch.index, globalSearch.query);
      renderGlobalSearch();
    });
    globalSearchInput.addEventListener('compositionend', () => globalSearchInput.dispatchEvent(new Event('input')));
    globalSearchResults.addEventListener('click', event => {
      if (event.target.closest('#showMoreSearchResults')) {
        globalSearch.limit += 30;
        renderGlobalSearch();
        return;
      }
      const button = event.target.closest('[data-search-result]');
      if (!button) return;
      const entry = globalSearch.matches[Number(button.dataset.searchResult)];
      const hit = entry?.occurrences[Number(button.dataset.searchHit)];
      if (!hit) return;
      const reportIndex = reports.findIndex(report => report.date === hit.date);
      if (reportIndex < 0) return;
      state.reportIndex = reportIndex;
      state.query = ''; searchInput.value = '';
      state.tag = 'all'; tagSelect.value = 'all';
      state.demoOnly = false; demoOnly.checked = false;
      globalSearchDialog.close();
      render();
      navigationNotice.hidden = false;
      navigationNotice.textContent = `已打开 ${hit.date} · ${hit.title}。当前日报的搜索、标签和 Demo 筛选已清除，目标游戏已标出。`;
      const target = [...sections.querySelectorAll('.game-card')].find(card => card.dataset.gameId === entry.id && card.dataset.sectionKey === hit.sectionKey);
      if (target) {
        target.classList.add('search-target'); target.tabIndex = -1;
        target.focus({ preventScroll: true });
        target.scrollIntoView({ block: 'center', behavior: 'instant' });
      }
    });

    function formatDate(date) { const [, month, day] = date.split('-'); return `${month}月${day}日`; }
    function visibleGames(games) {
      return games.filter(game => {
        const haystack = `${game.name} ${game.en} ${game.studio} ${game.publisher}`.toLowerCase();
        return (!state.query || haystack.includes(state.query.toLowerCase())) && (state.tag === 'all' || game.tags.includes(state.tag)) && (!state.demoOnly || game.demo);
      }).sort((a, b) => {
        if (state.sort === 'reviews') {
          const count = game => Number(String(game.reviews ?? 0).replace(/[,，\s]/g, '')) || 0;
          return count(b) - count(a) || (b.rating ?? -1) - (a.rating ?? -1);
        }
        if (state.sort === 'time') return a.time.localeCompare(b.time);
        if (state.sort === 'price') return a.priceValue - b.priceValue;
        return b.rating - a.rating;
      });
    }
    function gameCard(game, sectionKey = '') {
      const ratingClass = game.rating < 80 ? 'low' : '';
      const escapeText = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const stamp = value => value ? new Date(value).toLocaleString('zh-CN', { timeZone:'Asia/Shanghai',hour12:false }) : '原始日报';
      const reviewText = game.metadataPending?.includes('reviews') ? '测评待核实' : `${game.reviews || '0'} 条测评`;
      const dateNote = game.storeReleaseText ? `<div class="info-line"><span class="info-label">商店原文</span><span class="info-value" title="${escapeText(game.storeReleaseText)}">${escapeText(game.storeReleaseText)}</span></div>` : '';
      const snapshotNote = game.provisional ? '已发现，详情待补充' : `${game.recoveredAt ? '补录 ' + stamp(game.recoveredAt) + ' · ' : ''}价格快照：${stamp(game.priceSnapshotAt || game.snapshotAt || game.recoveredAt)} · 测评快照：${stamp(game.reviewSnapshotAt || game.snapshotAt || game.recoveredAt)}`;
      return `<article class="game-card" data-game-id="${escapeText(game.id)}" data-section-key="${escapeText(sectionKey)}">
        <img class="cover" src="${game.cover}" alt="${game.name} 封面" loading="lazy" onerror="this.style.display='none'; this.parentElement.classList.add('cover-missing')" />
        <div class="card-body">
          <div class="card-topline"><div><h3 class="game-name">${escapeText(game.name)}</h3><div class="game-name-en">${escapeText(game.en)}</div></div><div class="rating ${ratingClass}">${game.rating == null ? '暂无' : `${game.rating}%`}<small>${reviewText}</small></div></div>
          <div class="tags">${game.status.map(status => `<span class="tag ${status === 'Demo' ? 'demo' : 'status'}">${escapeText(status)}</span>`).join('')}${game.tags.map(tag => `<span class="tag">${escapeText(tag)}</span>`).join('')}</div>
          <div class="card-info"><div class="info-line release-time"><span class="info-label">时间</span><span class="info-value" title="${escapeText(game.time)}">${escapeText(game.time)}</span></div>${dateNote}<div class="info-line"><span class="info-label">开发</span><span class="info-value">${escapeText(game.studio)}</span></div><div class="info-line"><span class="info-label">发行</span><span class="info-value">${escapeText(game.publisher)}</span></div></div>
          <div class="card-footer"><span class="price ${game.price === '免费' ? 'free' : ''}">${game.price}</span><span class="price-note" title="${escapeText(snapshotNote)}">${snapshotNote}</span><a class="store-link" href="https://store.steampowered.com/app/${game.id}/" target="_blank" rel="noreferrer">打开商店 ↗</a></div>
        </div>
      </article>`;
    }
    function renderRail() {
      dateRail.innerHTML = reports.map((report, index) => {
        const total = new Set(allGames(report).map(game => game.id)).size;
        return `<button class="date-card ${index === state.reportIndex ? 'active' : ''}" data-index="${index}"><span class="date-label">${report.collection?.coverage ? (report.collection.state === 'partial' ? '持续补查' : '已复查，仍会补充') : report.label}</span><span class="date-number"><strong>${formatDate(report.date)}</strong><span class="date-count">${total} 条</span></span></button>`;
      }).join('');
      dateRail.querySelectorAll('.date-card').forEach(button => button.addEventListener('click', () => { state.reportIndex = Number(button.dataset.index); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
    }
    function render() {
      navigationNotice.hidden = true;
      const report = reports[state.reportIndex];
      renderRail();
      if (!report) {
        sections.innerHTML = '<div class="empty">暂无已保存的日报，请等待首次云端采集。</div>';
        resultMeta.textContent = '等待日报';
        return;
      }
      const visibleIds = new Set();
      sections.innerHTML = (report.collection?.coverage ? `<div class="empty">日报发布后持续复查，发现迟到游戏会补录。当前 ${report.collection.pendingIds?.length || 0} 个条目待核实；搜索复查不代表 Steam 全量覆盖。${report.collection.lastCheckedAt ? ' 最近复查：' + new Date(report.collection.lastCheckedAt).toLocaleString('zh-CN', { timeZone:'Asia/Shanghai',hour12:false }) : ''}</div>` : report.collection?.state === 'partial' ? `<div class="empty">这天的日报部分完成：已保存成功条目，${report.collection.pendingIds?.length || 0} 个项目等待重试${report.collection.scanComplete ? '。' : '；搜索尚未完整覆盖，将继续补查。'}</div>` : '') + (report.recovery && !report.collection?.coverage ? `<div class="empty">${report.recovery.note}${report.recovery.recoveredAt ? ' 补采时间：' + new Date(report.recovery.recoveredAt).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false }) : ''}</div>` : '') + report.sections.map(section => {
        const games = visibleGames(section.games);
        games.forEach(game => visibleIds.add(game.id));
        return `<section><div class="section-heading"><div class="section-title"><span class="section-dot ${section.tone === 'blue' ? 'blue' : section.tone === 'mint' ? 'mint' : ''}"></span><h2>${section.title}</h2><span class="section-count">${games.length} 款</span></div><span class="section-rule"></span></div>${games.length ? `<div class="game-grid">${games.map(game => gameCard(game, section.key)).join('')}</div>` : `<div class="empty">${report.recovery ? '缺失历史或尚未补采到可核实条目' : '暂无符合条件的条目'}</div>`}</section>`;
      }).join('');
      resultMeta.textContent = `当前日报 ${visibleIds.size} 款`;
    }
    searchInput.addEventListener('input', event => { state.query = event.target.value.trim(); render(); });
    tagSelect.addEventListener('change', event => { state.tag = event.target.value; render(); });
    sortSelect.addEventListener('change', event => { state.sort = event.target.value; render(); });
    demoOnly.addEventListener('change', event => { state.demoOnly = event.target.checked; render(); });
    async function loadLiveReports() {
      if (location.protocol === 'file:') return;
      const cloud = window.STEAM_DAILY_STATIC === true;
      try {
        const [response, statusResponse] = await Promise.all([
          fetch(cloud ? './data/state.json' : '/api/reports?days=30', { cache: 'no-store' }),
          fetch(cloud ? './data/status.json' : '/api/status', { cache: 'no-store' })
        ]);
        if (!response.ok || !statusResponse.ok) throw new Error('日报服务暂不可用');
        const payload = await response.json();
        const status = await statusResponse.json();
        if (Array.isArray(payload.reports) && payload.reports.length) {
          reports = payload.reports.map(report => ({ ...report, label: report.label || '日报' }));
          const failed = status.state === 'error';
          const partial = status.state === 'partial';
          const latestComplete = reports.find(report => report.date === status.reportDate)?.collection?.state === 'complete';
          document.querySelector('#dataStatus').innerHTML = `<strong>${cloud ? '云端日报' : '本地日报'}</strong> · ${partial ? '部分完成，将自动重试' : failed ? latestComplete ? '最新日报完成，历史待补采' : '采集仍有缺漏，已保留保存结果' : '真实 Steam 数据'}`;
          document.querySelector('#dataStatus').classList.toggle('demo', failed);
          document.querySelector('#syncStatus').textContent = `最后同步：${payload.generatedAt ? new Date(payload.generatedAt).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false }) : '未知'} · Steam 公共接口`;
          refreshTags(); refreshGlobalSearch(); render();
        } else if (cloud) {
          document.querySelector('#dataStatus').textContent = '云端日报 · 等待首次采集';
        }
      } catch (error) {
        document.querySelector('#dataStatus').textContent = cloud ? '云端日报暂时无法读取，请稍后刷新' : '演示数据 · 本地服务未返回日报';
      }
    }
    refreshTags(); refreshGlobalSearch(); render(); loadLiveReports();
  </script>
</body>
</html>
