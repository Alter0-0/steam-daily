name: Steam Daily Cloud

on:
  schedule:
    # UTC 20:00 = Asia/Shanghai 04:00 the following day.
    - cron: '0 20 * * *'
    # Resume throughout the day. Published days remain subject to rolling checks.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: '只更新网页（使用已有日报，不重新采集）'
        type: boolean
        default: false
      review_30:
        description: '立即回查最近30天（会保存进度并分轮续采）'
        type: boolean
        default: false
      priority_app_ids:
        description: '优先核验的已发现游戏 AppID（逗号分隔，最多20个）'
        type: string
        default: ''
      max_details:
        description: '本轮最多处理条数（0为使用完整30分钟时段）'
        type: string
        default: '0'
  push:
    branches: [main]
    paths-ignore: ['data/**', 'outputs/README.md', 'CLOUD-SETUP.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: steam-daily-cloud
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify report merging, paging and durable storage
        run: node --test work/history.test.mjs work/cloud.test.mjs work/phase1.test.mjs work/search.test.mjs work/progress.test.mjs
      - name: Restore durable reports and successful detail requests
        id: restore
        run: node cloud/state-branch.mjs load
      - name: Collect or resume pending records
        id: collect
        if: ${{ !inputs.publish_only && github.event_name != 'push' }}
        continue-on-error: true
        env:
          PRIORITY_APP_IDS: ${{ inputs.priority_app_ids }}
          MAX_DETAILS: ${{ inputs.max_details || '0' }}
        run: node cloud/run.mjs ${{ inputs.review_30 && '--review-30' || '' }}
      - name: Save progress even if Steam is unavailable
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: node cloud/state-branch.mjs save
      - name: Build website from actual saved reports
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: node cloud/build.mjs
      - name: Configure Pages
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/configure-pages@v5
      - name: Upload website
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Keep incomplete collection visible in Actions
        if: ${{ steps.collect.outcome == 'failure' }}
        run: exit 1
